name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      backend_only:
        description: Run only the disposable local Supabase verification
        type: boolean
        default: false
      load_test:
        description: Run the disposable local 10k/50k/500k load fixture up to 200 sessions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Only test configuration. No Supabase, Firebase, EAS or Sentry credentials.
env:
  CI: '1'
  APP_VARIANT: development
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_APP_ENV: development
  EXPO_PUBLIC_ENABLE_DEMO: 'false'
  EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_razemgo_browser_test_only
  EXPO_PUBLIC_SENTRY_DSN: https://testonly@monitoring.razemgo.invalid/1
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'

jobs:
  code-and-bundles:
    name: Code, database, Edge Functions and exports
    if: github.event_name != 'workflow_dispatch' || !inputs.backend_only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:source
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Test Edge Functions with mocked transports
        run: >-
          deno test --config supabase/functions/deno.json --frozen
          --allow-env --allow-net --allow-sys --allow-read
          supabase/functions/_shared/monitoring.test.ts
          supabase/functions/_shared/monitoring-dev.test.ts
          supabase/functions/dispatch-push/handler.test.ts
          supabase/functions/monitor-push/handler.test.ts
          supabase/functions/delete-account/handler.test.ts
      - run: npx expo install --check
      - run: npx --yes expo-doctor
      - run: npx expo export --platform android --output-dir .expo/ci-android
      - run: npx expo export --platform web --output-dir .expo/ci-web

  local-supabase:
    name: Local Auth, PostgreSQL contracts and schema types
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Start disposable local backend without Edge workers or mail
        id: local-start
        run: npx --yes supabase@2.122.0 start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - id: local-reset
        run: npx --yes supabase@2.122.0 db reset --local --no-seed
      - run: npm run types:database -- --local --check
      - run: npm run test:local-backend
        if: ${{ !cancelled() && steps.local-reset.outcome == 'success' }}
      - name: Optional full synthetic HTTP load (local only)
        if: github.event_name == 'workflow_dispatch' && inputs.load_test
        run: npm run benchmark:load -- --seed --strict
      - name: Preserve failed checks and measured load results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-backend-results
          path: |
            .expo/hardening-http-load.json
            .expo/database.generated.local.ts
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: npx --yes supabase@2.122.0 stop --no-backup

  browser:
    name: Browser user flows
    if: github.event_name != 'workflow_dispatch' || !inputs.backend_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - name: Retain failed browser checks for seven days
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: .expo/auth-web-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
